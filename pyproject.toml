[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-agent"
version = "0.3.2"
description = "A local-first, explainable AI agent framework with self-healing, detailed error diagnostics, and interactive tool-calling traces."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Emre" }
]
keywords = ["agent", "llm", "tool-calling", "evaluation", "xai", "self-healing"]
dependencies = [
  "openai>=1.54.0",
  "json-repair>=0.30.3",
  "ddgs>=0.1.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
# Only the benchmark scripts under scripts/ need these; they import them
# defensively and degrade when absent.
eval = [
  "tenacity>=8.2.3",
  "pydantic>=2.9.0",
  "jsonschema>=4.0.0"
]
dev = [
  "twine>=5.1.1",
  "build>=1.2.1",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "tenacity>=8.2.3",
  "pydantic>=2.9.0",
  "jsonschema>=4.0.0"
]

[project.urls]
Repository = "https://github.com/emredeveloper/explainable-agent-lab"
Issues = "https://github.com/emredeveloper/explainable-agent-lab/issues"

[project.scripts]
explainable-agent = "explainable_agent.cli:main"

[tool.setuptools.packages.find]
include = ["explainable_agent*"]

[tool.setuptools.package-data]
explainable_agent = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".pytest_cache", ".pytest_tmp", "pytest-cache-files-*"]
