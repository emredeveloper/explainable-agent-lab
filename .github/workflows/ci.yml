name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must cover every version allowed by requires-python (>=3.10).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Compile source files
        run: python scripts/prepublish_check.py

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: |
          mkdir -p .tmp
          pytest -q --basetemp=.tmp/pytest

      - name: Build package
        run: python -m build
